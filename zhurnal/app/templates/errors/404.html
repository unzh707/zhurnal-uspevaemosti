{% extends "base.html" %}

{% block title %}Страница не найдена{% endblock %}

{% block content %}
<div class="empty-state" style="text-align: center; padding: 4rem 0;">
    <h1>404</h1>
    <p>Страница не найдена, либо у вас нет доступа к этим данным.</p>
    <a href="{{ url_for('main.dashboard') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary">
        На главную
    </a>
</div>
{% endblock %}
